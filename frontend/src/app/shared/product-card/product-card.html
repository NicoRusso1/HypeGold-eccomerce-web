<a
  [routerLink]="['/producto', product.slug]"
  class="group block overflow-hidden rounded-2xl border border-gold-200/60 bg-white transition hover:shadow-lg"
>
  <div class="relative aspect-square overflow-hidden bg-gold-50">
    <button
      type="button"
      (click)="toggleFavorito($event)"
      [attr.aria-label]="favoriteService.isFavorite(product.id) ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      class="absolute right-2 top-2 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-white/90 text-hg-charcoal shadow transition hover:scale-110"
    >
      @if (favoriteService.isFavorite(product.id)) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4 text-gold-500">
          <path d="M11.645 20.91a.75.75 0 0 0 .71 0c3.19-1.688 6.55-4.475 8.42-7.79 1.3-2.31 1.72-5.1.25-7.24-1.5-2.19-4.53-3.03-6.99-1.01a.75.75 0 0 1-.94 0C10.63 3.04 7.6 2.2 6.1 4.39c-1.47 2.14-1.05 4.93.25 7.24 1.87 3.31 5.23 6.1 8.42 7.79Z" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.645 20.91a.75.75 0 0 0 .71 0c3.19-1.688 6.55-4.475 8.42-7.79 1.3-2.31 1.72-5.1.25-7.24-1.5-2.19-4.53-3.03-6.99-1.01a.75.75 0 0 1-.94 0C10.63 3.04 7.6 2.2 6.1 4.39c-1.47 2.14-1.05 4.93.25 7.24 1.87 3.31 5.23 6.1 8.42 7.79Z" />
        </svg>
      }
    </button>

    @if (product.image) {
      <img
        [src]="product.image"
        [alt]="product.name"
        class="h-full w-full object-cover transition group-hover:scale-105"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center text-5xl">💍</div>
    }
  </div>

  <div class="p-4">
    @if (product.category) {
      <p class="text-xs font-medium uppercase tracking-wide text-gold-600">{{ product.category.name }}</p>
    }
    <h3 class="mt-1 font-medium text-hg-charcoal">{{ product.name }}</h3>
    <p class="mt-1 text-sm text-hg-charcoal/60">{{ product.material }}</p>
    <p class="mt-2 font-display text-lg font-semibold text-gold-600">
      {{ product.base_price | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}
    </p>
    @if (product.total_stock === 0) {
      <p class="mt-1 text-xs font-medium text-red-500">Sin stock</p>
    }
  </div>
</a>
