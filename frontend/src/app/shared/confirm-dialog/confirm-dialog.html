@if (dialogService.state(); as dialog) {
  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 px-4"
    (click)="cancelar()"
  >
    <div
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="dialog.title"
      class="w-full max-w-sm rounded-2xl bg-surface p-6 shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <h2 class="font-display uppercase tracking-wide text-lg font-semibold text-hg-black">{{ dialog.title }}</h2>
      <p class="mt-2 text-sm text-hg-charcoal/70">{{ dialog.message }}</p>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="cancelar()"
          class="rounded-full border border-gold-300 px-5 py-2 text-sm font-medium text-hg-charcoal transition hover:border-gold-500"
        >
          {{ dialog.cancelText }}
        </button>
        <button
          type="button"
          (click)="confirmar()"
          class="rounded-full bg-red-500 px-5 py-2 text-sm font-semibold text-white transition hover:bg-red-600"
        >
          {{ dialog.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
