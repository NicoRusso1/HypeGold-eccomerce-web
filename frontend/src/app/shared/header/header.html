<header class="sticky top-0 z-50 border-b border-gold-200/60 bg-hg-ivory/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a routerLink="/" class="flex items-center gap-2">
      <img
        src="assets/logo-isotipo.webp"
        alt="HypeGold"
        class="h-10 w-10"
      />
      <span class="font-display text-lg font-semibold tracking-wide text-hg-black">
        Hype<span class="text-gold-600">Gold</span>
      </span>
    </a>

    <nav class="hidden items-center gap-6 text-sm font-medium text-hg-charcoal sm:flex">
      <a routerLink="/" class="transition hover:text-gold-600">Inicio</a>
      <a routerLink="/catalogo" class="transition hover:text-gold-600">Catálogo</a>
      <a routerLink="/catalogo/anillos" class="transition hover:text-gold-600">Anillos</a>
      <a routerLink="/catalogo/cadenas" class="transition hover:text-gold-600">Cadenas</a>
    </nav>

    <div class="flex items-center gap-3">
      <button
        type="button"
        aria-label="Ver carrito"
        class="relative rounded-full p-2 text-hg-charcoal transition hover:bg-gold-50 hover:text-gold-600"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 1.994-4.694 2.602-7.167.084-.342-.174-.667-.526-.667H5.106M7.5 14.25 5.106 5.106M7.5 14.25 5.25 21m11.25-6.75L18.75 21m-9.75 0h9.75" />
        </svg>
        <span class="absolute -right-1 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-gold-500 px-1 text-[10px] font-semibold text-hg-ivory">0</span>
      </button>

      @if (authService.isLoggedIn()) {
        <a
          routerLink="/cuenta/perfil"
          class="hidden text-sm text-hg-charcoal transition hover:text-gold-600 sm:inline"
        >
          Hola, {{ authService.currentUser()?.name?.split(' ')?.[0] }}
        </a>
        <button
          type="button"
          (click)="logout()"
          class="rounded-full border border-gold-300 px-4 py-1.5 text-sm font-medium text-hg-black transition hover:border-gold-500 hover:text-gold-600"
        >
          Salir
        </button>
      } @else {
        <a
          routerLink="/cuenta/ingresar"
          class="rounded-full border border-gold-300 px-4 py-1.5 text-sm font-medium text-hg-black transition hover:border-gold-500 hover:text-gold-600"
        >
          Ingresar
        </a>
      }
    </div>
  </div>
</header>
