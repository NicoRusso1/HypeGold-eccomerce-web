<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6">
  <div class="rounded-2xl border border-gold-200/60 bg-white p-8 shadow-sm">
    <h1 class="font-display text-2xl font-semibold text-hg-black">Ingresar</h1>
    <p class="mt-1 text-sm text-hg-charcoal/70">Iniciá sesión con tu cuenta de HypeGold.</p>

    @if (serverErrors()['general']) {
      <p class="mt-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ serverErrors()['general'][0] }}
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-hg-charcoal">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="mt-1 w-full rounded-lg border border-gold-200 px-3 py-2 text-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        />
        @if (fieldError('email'); as error) {
          <p class="mt-1 text-xs text-red-600">{{ error }}</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-hg-charcoal">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="mt-1 w-full rounded-lg border border-gold-200 px-3 py-2 text-sm focus:border-gold-500 focus:outline-none focus:ring-1 focus:ring-gold-500"
        />
        @if (fieldError('password'); as error) {
          <p class="mt-1 text-xs text-red-600">{{ error }}</p>
        }
        <a routerLink="/cuenta/olvide-contrasena" class="mt-1 inline-block text-xs font-medium text-gold-600 hover:text-gold-700">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-full bg-gold-500 py-2.5 text-sm font-semibold text-hg-black transition hover:bg-gold-400 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ submitting() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-hg-charcoal/70">
      ¿No tenés cuenta?
      <a routerLink="/cuenta/registro" class="font-medium text-gold-600 hover:text-gold-700">Creá una acá</a>
    </p>
  </div>
</section>
