<section class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
  @if (loading()) {
    <p class="text-center text-hg-charcoal/60">Cargando comprobante...</p>
  } @else if (notFound() || !order()) {
    <div class="text-center">
      <p class="text-hg-charcoal/60">No encontramos ese pedido.</p>
    </div>
  } @else {
    <app-receipt [order]="order()!">
      <a back-link [routerLink]="['/cuenta/pedidos', order()!.id]" class="text-sm font-medium text-gold-600 hover:text-gold-700">
        ← Volver al pedido
      </a>
    </app-receipt>
  }
</section>
